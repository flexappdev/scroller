<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><title>Top 100 Future Hong Kong</title><meta name="description" content="100 cinematic visions of Future Hong Kong, ranked 1 to 100."><style>
:root{color-scheme:dark;--bg:#05070b;--line:#ffffff26;--accent:#48d8ff;--muted:#b9c0ca}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}body{overflow:hidden}.header{position:fixed;top:0;left:0;right:0;z-index:20;height:62px;display:flex;align-items:center;gap:12px;padding:env(safe-area-inset-top) 14px 0;background:linear-gradient(#05070bef,#05070b99 68%,transparent);backdrop-filter:blur(12px)}.brand{font-weight:800;letter-spacing:.04em;text-decoration:none;white-space:nowrap}.brand b{color:var(--accent)}.count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.select{appearance:none;background:#10151d;border:1px solid var(--line);color:#fff;padding:8px 10px;border-radius:999px;font-size:12px;max-width:168px}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.item{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:grid;place-items:center;overflow:hidden;background:#05070b}.blur{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(42px) brightness(.34) saturate(1.3);transform:scale(1.12);transition:background-image .2s}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0009 0%,transparent 28%,transparent 60%,#03050be8 100%)}.frame{position:relative;width:min(100vw,1200px);aspect-ratio:16/9;display:grid;place-items:center;z-index:2}.frame img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 24px 55px #0009);background:#0a0d12}.skeleton{background:linear-gradient(110deg,#0d1118 25%,#161d28 45%,#0d1118 65%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}@keyframes shimmer{to{background-position:-200% 0}}.meta{position:absolute;z-index:4;left:18px;right:82px;bottom:max(76px,calc(env(safe-area-inset-bottom) + 64px));text-shadow:0 2px 14px #000}.eyebrow{display:flex;align-items:center;gap:9px;color:#d9f5ff;font-size:12px;text-transform:uppercase;letter-spacing:.13em}.rank{display:grid;place-items:center;min-width:38px;height:29px;border:1px solid #9ae9ff80;background:#07141bcc;border-radius:999px;color:var(--accent);font-weight:800;letter-spacing:0}.meta h2{font:700 clamp(28px,6.4vw,56px)/1.02 Georgia,serif;letter-spacing:-.025em;margin:9px 0 8px}.meta p{color:#dde3e9;margin:0;max-width:680px;font-size:clamp(14px,2vw,18px)}.actions{position:absolute;z-index:5;right:13px;bottom:max(78px,calc(env(safe-area-inset-bottom) + 66px));display:grid;gap:10px}.actions button{width:52px;height:52px;border-radius:50%;border:1px solid #fff3;background:#0a0e15b8;color:#fff;font-size:22px;backdrop-filter:blur(10px)}.footer{position:fixed;z-index:20;left:0;right:0;bottom:0;height:58px;padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;gap:24px;background:linear-gradient(transparent,#05070bdc 35%,#05070b);pointer-events:none}.footer button{pointer-events:auto;background:transparent;border:0;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.13em}.dots{width:70px;height:3px;border-radius:3px;background:#ffffff2e;overflow:hidden}.dots span{display:block;height:100%;width:1%;background:var(--accent);transition:width .2s}.help{display:none;color:#8f98a6;font-size:11px}.toast{position:fixed;z-index:40;left:50%;bottom:82px;transform:translateX(-50%);background:#10151dec;border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:580px){.header{gap:7px}.brand{font-size:12px}.select{max-width:126px}.count{font-size:12px}.frame{width:100vw}.meta p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}@media(min-width:900px){.header{padding-left:28px;padding-right:28px}.meta{left:max(40px,calc((100vw - 1200px)/2));right:auto}.actions{right:max(38px,calc((100vw - 1260px)/2))}.help{display:block}.frame{width:min(82vw,1200px)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><header class="header"><a class="brand" href="/top100">TOP<b>100</b> / FUTURE HK</a><span class="help">↑ ↓ navigate</span><select id="collection" class="select" aria-label="Collection"></select><span class="count" id="count">01 / 100</span></header><main id="feed" class="feed" aria-label="Top 100 Future Hong Kong"></main><div class="footer"><button id="prev">Previous</button><div class="dots"><span id="progress"></span></div><button id="random">Random</button><button id="next">Next</button></div><div class="toast" id="toast">Link copied</div><script>
const BASE='/top100/future-hong-kong/';const feed=document.getElementById('feed'),count=document.getElementById('count'),progress=document.getElementById('progress'),select=document.getElementById('collection');let scenes=[],worlds=[],current=0;const packs=new Map(),pad=n=>String(n).padStart(2,'0'),packNo=n=>Math.floor((n-1)/5)+1;
async function loadPack(n){const p=packNo(n);if(packs.has(p))return packs.get(p);const promise=fetch(BASE+`pack-${String(p).padStart(2,'0')}.json`).then(r=>r.json()).then(rows=>{for(const row of rows){const url='data:image/webp;base64,'+row.data;const img=document.querySelector(`#item-${row.number} img`),blur=document.querySelector(`#item-${row.number} .blur`);if(img){img.src=url;img.classList.remove('skeleton')}if(blur)blur.style.backgroundImage=`url('${url}')`}return rows});packs.set(p,promise);return promise}
function preloadAround(n){[n,n+1,n+2].filter(x=>x>=1&&x<=100).forEach(loadPack)}
function card(s){const el=document.createElement('article');el.className='item';el.id='item-'+s.number;el.dataset.index=s.number-1;el.innerHTML=`<div class="blur"></div><div class="shade"></div><div class="frame"><img class="skeleton" alt="${s.title}"></div><div class="meta"><div class="eyebrow"><span class="rank">${pad(s.number)}</span><span>${worlds[s.world].name}</span></div><h2>${s.title}</h2><p>${s.description}</p></div><div class="actions"><button class="share" aria-label="Copy link to ${s.title}">↗</button></div>`;el.querySelector('.share').onclick=()=>copyLink(s.number);return el}
function go(i){i=Math.max(0,Math.min(99,i));document.getElementById('item-'+(i+1))?.scrollIntoView({behavior:'smooth'})}function copyLink(n){const u=new URL(location.href);u.hash='item-'+n;navigator.clipboard?.writeText(u.href);const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),900)}function update(i){current=i;const s=scenes[i];count.textContent=`${pad(s.number)} / 100`;progress.style.width=s.number+'%';select.value=String(s.world);history.replaceState(null,'','#item-'+s.number);preloadAround(s.number)}
fetch(BASE+'data.json').then(r=>r.json()).then(data=>{worlds=data.worlds;scenes=data.scenes;select.innerHTML='<option value="-1">All 100</option>'+worlds.map((w,i)=>`<option value="${i}">${i+1}. ${w.name}</option>`).join('');scenes.forEach(s=>feed.append(card(s)));const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.58)update(Number(e.target.dataset.index))}),{root:feed,threshold:[.58]});document.querySelectorAll('.item').forEach(x=>obs.observe(x));preloadAround(1);const h=location.hash.match(/item-(\d+)/);if(h)setTimeout(()=>go(Number(h[1])-1),100)});
select.onchange=()=>{const w=Number(select.value);if(w>=0)go(w*10)};document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('random').onclick=()=>go(Math.floor(Math.random()*100));document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();go(current+1)}if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(current-1)}});
</script></body></html>
