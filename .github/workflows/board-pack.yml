name: Sunday board pack

on:
  schedule:
    - cron: '0 7 * * 0' # Sundays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  board-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write board pack
        env:
          REVENUE_URL: ${{ vars.REVENUE_URL }}
          REVENUE_API_TOKEN: ${{ secrets.REVENUE_API_TOKEN }}
        run: node scripts/board-pack.mjs
      - name: Commit
        run: |
          git config user.name "scroller-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/board
          git diff --cached --quiet || git commit -m "board: pack $(date -u +%F)"
          git push
